spring.application.name=autoloc-api
server.servlet.context-path=/api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
logging.level.org.springframework.data.repository=DEBUG

# Planification des tâches
# Contrats arrivant à échéance sous 48 h : du lundi au vendredi à 7h00
scheduler.contrats.cron=0 0 7 * * MON-FRI
# Clôture des réservations expirées et libération des véhicules : tous les jours à 1h00
scheduler.vehicules.cron=0 0 1 * * *
